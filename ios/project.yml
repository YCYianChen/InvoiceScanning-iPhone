name: InvoiceScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  InvoiceScanner:
    type: application
    platform: iOS
    sources: [InvoiceScanner]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InvoiceScanner
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "需要使用相機掃描發票 QR Code"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "發票記帳"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme: {}
