name: InvoiceScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  InvoiceScanner:
    type: application
    platform: iOS
    sources: [InvoiceScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InvoiceScanner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "需要使用相機掃描發票 QR Code"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "發票記帳"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
